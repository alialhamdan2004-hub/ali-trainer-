<!--
  شكل عضوي ناعم (Blob) بتدرج لوني خفيف — يُستخدم كتوهج خلفية ناعم خلف
  المحتوى بدل الأشكال الهندسية الجامدة. غالباً يُستخدم مع filter: blur في CSS.
-->
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blobGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fa84a"/>
      <stop offset="100%" stop-color="#8a5a3a"/>
    </linearGradient>
  </defs>
  <path fill="url(#blobGrad)" d="M320 90 C 370 140, 380 230, 330 290 C 280 350, 170 370, 100 320
    C 30 270, 20 160, 80 100 C 140 40, 270 40, 320 90 Z"/>
</svg>
